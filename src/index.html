<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Interactive map of the National Park Service sites we have visited."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#dbe7ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b2229"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="<%= require('./img/icon-180.png') %>" />
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <header class="app-bar"></header>
    <main id="map-container" class="map-container"></main>
    <nav class="toolbar" aria-label="Map tools"></nav>
    <div id="sheets"></div>
  </body>
</html>
